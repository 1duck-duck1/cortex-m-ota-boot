name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-target:
    name: 交叉编译 (arm-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build
      - name: 编译 Boot / App Slot A / App Slot B
        run: |
          cmake -B build/f407 -G Ninja -DBOARD=stm32f407_demo
          cmake --build build/f407
