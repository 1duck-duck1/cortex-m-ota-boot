name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  preflight:
    name: 检查构建系统是否就绪
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::构建系统尚未就绪（缺少 CMakeLists.txt），跳过编译与测试。将在 v0.1.0 引入构建系统后自动启用。"
          fi

  build-target:
    name: 交叉编译 (arm-none-eabi)
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build
      - name: 编译 STM32F103 示例
        run: |
          cmake -B build/f103 -G Ninja -DBOARD=stm32f103_demo
          cmake --build build/f103
      - name: 编译 STM32F407 示例
        run: |
          cmake -B build/f407 -G Ninja -DBOARD=stm32f407_demo
          cmake --build build/f407

  test-core:
    name: core 单元测试 (host)
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 编译并运行单元测试
        run: |
          cmake -B build/test -G Ninja -DBOOT_BUILD_TESTS=ON
          cmake --build build/test
          ctest --test-dir build/test --output-on-failure

  lint-python:
    name: Python 工具链检查
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 静态检查
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          flake8 code/tools
          pytest code/tools -q